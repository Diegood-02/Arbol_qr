<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Árbol QR Voxel</title>
  <style>
    :root {
      --cream: #F4F0E6;
      --text: #2f2b25;
      --panel: rgba(255, 255, 255, 0.8);
      --panel-border: rgba(255, 255, 255, 0.7);
      --accent: #2c7a4b;
      --shadow: 0 10px 28px rgba(52, 40, 25, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 38%, #fcf9f1 0%, #efe8d6 70%, #e4dcc7 100%);
      color: var(--text);
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 18px;
      gap: 10px;
    }

    .title-badge {
      margin-top: 6px;
      margin-bottom: auto;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 18px rgba(58, 42, 26, 0.1);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--text) 90%, #ffffff 10%);
      backdrop-filter: blur(5px);
    }

    .status {
      min-height: 20px;
      font-size: 0.88rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      opacity: 0.9;
      transition: opacity 0.25s ease;
    }

    .status.ok {
      color: #215b3a;
    }

    .status.error {
      color: #b42318;
      background: rgba(255, 228, 228, 0.9);
    }

    .season-row,
    .input-row,
    .toggle-wrap {
      pointer-events: auto;
      width: min(640px, 100%);
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .season-row,
    .toggle-wrap {
      width: min(520px, 100%);
    }

    .season-row {
      padding: 6px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 20px rgba(52, 39, 24, 0.1);
    }

    .input-row {
      background: var(--panel);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(5px);
      box-shadow: var(--shadow);
    }

    input[type="url"] {
      flex: 1;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      min-width: 0;
      background: white;
      color: var(--text);
    }

    input[type="url"]:focus {
      outline: none;
      border-color: rgba(44, 122, 75, 0.45);
      box-shadow: 0 0 0 3px rgba(44, 122, 75, 0.16);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }
    button:active { transform: translateY(0); }

    .toggle-btn {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 92%, #ffffff 8%), var(--accent));
      color: #fff;
      border-radius: 999px;
      padding: 11px 20px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 38%, transparent);
      letter-spacing: 0.01em;
      min-width: 220px;
    }

    .season-btn[data-season="spring"] { background: #f2f7ea; }
    .season-btn[data-season="summer"] { background: #f7f5dd; }
    .season-btn[data-season="autumn"] { background: #f9e8dd; }

    .season-btn {
      min-width: 102px;
    }

    .season-btn.active {
      outline: 2px solid rgba(0, 0, 0, 0.26);
      transform: translateY(-1px);
    }

    @media (max-width: 560px) {
      .season-row { gap: 8px; }
      button { font-size: 0.84rem; padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="ui">
      <div class="title-badge">Voxel QR Tree</div>
      <div id="status" class="status" aria-live="polite"></div>

      <div class="toggle-wrap">
        <button id="toggleViewBtn" class="toggle-btn">Tap to see the tree</button>
      </div>

      <div class="input-row">
        <input id="urlInput" type="url" placeholder="https://example.com" />
        <button id="generateBtn">Actualizar QR</button>
      </div>

      <div class="season-row">
        <button class="season-btn" data-season="spring">Spring</button>
        <button class="season-btn active" data-season="summer">Summer</button>
        <button class="season-btn" data-season="autumn">Autumn</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    const app = document.getElementById('app');
    const urlInput = document.getElementById('urlInput');
    const generateBtn = document.getElementById('generateBtn');
    const toggleViewBtn = document.getElementById('toggleViewBtn');
    const statusEl = document.getElementById('status');
    const seasonButtons = Array.from(document.querySelectorAll('.season-btn'));

    // ---------- Escena ----------
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.prepend(renderer.domElement);

    const camera = new THREE.OrthographicCamera(-20, 20, 20, -20, 0.1, 500);
    camera.position.set(0, 80, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);

    // El mundo gira como un tornamesa; la luz va dentro para que el sombreado no cambie al girar.
    const world = new THREE.Group();
    scene.add(world);

    const hemi = new THREE.HemisphereLight(0xfff6e4, 0x8d7a5e, 1.25);
    world.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 2.1);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    world.add(sun);
    world.add(sun.target);

    const treeGroup = new THREE.Group();
    world.add(treeGroup);

    // ---------- Estado ----------
    const cellSize = 1;
    const quietZone = 4;
    const qrFlatHeight = 0.1;
    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    const tmpColor2 = new THREE.Color();

    let qrWorldSize = 21;
    let viewSize = 28;
    let isDiorama = false;
    let currentSeason = 'summer';
    let statusTimer = null;

    let qrMesh = null;
    let plinth = null;
    let detailMesh = null;
    let treeMesh = null;
    let particles = null;
    let particleVelocities = [];
    let entries = [];
    let details = [];
    let treeVoxels = [];
    let treeScale = 0.6;
    let treeBaseY = 0.3;

    let qrDirty = false;
    let colorsDirty = false;

    const blockAnim = { p: 0 };   // 0 = QR plano, 1 = diorama (alturas)
    const treeAnim = { n: 0 };    // fracción de voxels del árbol visibles
    const dragState = { active: false, x: 0 };

    const palettes = {
      spring: {
        dark: '#295f42', light: '#f3efe2', grass: '#b8da8c', leaves: '#8fd08f', accents: '#f1a7bd',
        trunk: '#7b573c', soil: '#8a6446', particle: '#f1a7bd', uiAccent: '#4f8f6a'
      },
      summer: {
        dark: '#1b4f30', light: '#f8f5ea', grass: '#8cc063', leaves: '#3f9f4c', accents: '#e7d45e',
        trunk: '#6d4c2f', soil: '#7a5a3c', particle: '#b48757', uiAccent: '#2c7a4b'
      },
      autumn: {
        dark: '#613a2a', light: '#f4e7d5', grass: '#c9a45c', leaves: '#d2762f', accents: '#a8412b',
        trunk: '#5b3c2b', soil: '#6c4a34', particle: '#b45b2a', uiAccent: '#8d4f31'
      }
    };

    // Colores "vivos" que gsap interpola al cambiar de estación.
    const live = {};
    Object.keys(palettes.summer).forEach((key) => {
      if (key !== 'uiAccent') live[key] = new THREE.Color(palettes.summer[key]);
    });

    // ---------- Utilidades ----------
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function cellHash(row, col) {
      const v = Math.sin(row * 12.9898 + col * 78.233) * 43758.5453;
      return v - Math.floor(v);
    }

    function setStatus(message, isError = false) {
      if (statusTimer) {
        clearTimeout(statusTimer);
        statusTimer = null;
      }
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
      statusEl.classList.toggle('ok', Boolean(message) && !isError);
      statusEl.style.opacity = message ? '0.92' : '0';
      if (message && !isError) {
        statusTimer = setTimeout(() => {
          statusEl.style.opacity = '0';
        }, 2400);
      }
    }

    function normalizeUrl(raw) {
      const value = raw.trim();
      if (!value) throw new Error('Ingresa una URL.');
      try {
        return new URL(value).toString();
      } catch {
        if (/^[\w.-]+\.[A-Za-z]{2,}(\/.*)?$/.test(value)) {
          return new URL(`https://${value}`).toString();
        }
      }
      throw new Error('URL inválida. Usa formato https://dominio.com');
    }

    function makeQrMatrix(url) {
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      const count = qr.getModuleCount();
      if (count > 65) {
        throw new Error('La URL es muy larga para este modo voxel.');
      }
      const matrix = [];
      for (let row = 0; row < count; row++) {
        const values = [];
        for (let col = 0; col < count; col++) {
          values.push(qr.isDark(row, col));
        }
        matrix.push(values);
      }
      return matrix;
    }

    function disposeMesh(mesh) {
      if (!mesh) return;
      mesh.parent && mesh.parent.remove(mesh);
      mesh.geometry.dispose();
      mesh.material.dispose();
      if (mesh.dispose) mesh.dispose();
    }

    // ---------- Árbol voxel procedural ----------
    function generateTree(seed) {
      const rnd = mulberry32(seed);
      const voxels = new Map();
      const key = (x, y, z) => (x + 64) + (y + 64) * 128 + (z + 64) * 16384;
      const put = (x, y, z, kind) => {
        const k = key(x, y, z);
        const prev = voxels.get(k);
        if (prev && prev.kind === 'trunk') return;
        voxels.set(k, { x, y, z, kind, j: 0 });
      };

      const H = 26;
      const phaseX = rnd() * 6.28;
      const phaseZ = rnd() * 6.28;
      const trunkX = (y) => Math.sin(y * 0.25 + phaseX) * 1.1 * (y / H);
      const trunkZ = (y) => Math.cos(y * 0.21 + phaseZ) * 0.9 * (y / H);

      // Tronco con raíces anchas y curvatura suave.
      for (let y = 0; y <= H; y++) {
        const r = 2.3 - 1.2 * (y / H) + (y < 3 ? (3 - y) * 0.45 : 0);
        const cx = trunkX(y);
        const cz = trunkZ(y);
        for (let dx = -4; dx <= 4; dx++) {
          for (let dz = -4; dz <= 4; dz++) {
            if (dx * dx + dz * dz <= r * r) put(Math.round(cx + dx), y, Math.round(cz + dz), 'trunk');
          }
        }
      }

      const blobs = [];
      blobs.push({ x: trunkX(H), y: H + 2, z: trunkZ(H), r: 6.8 });
      blobs.push({ x: trunkX(H - 3), y: H - 4, z: trunkZ(H - 3), r: 6.2 });

      // Ramas en espiral áurea, cada una termina en un racimo de hojas.
      const branchCount = 6;
      const a0 = rnd() * Math.PI * 2;
      for (let i = 0; i < branchCount; i++) {
        const ang = a0 + i * 2.4;
        const startY = 12 + i * 2.1;
        const length = 8 + rnd() * 4 - i * 0.4;
        const dirX = Math.cos(ang);
        const dirZ = Math.sin(ang);
        const sx = trunkX(startY);
        const sz = trunkZ(startY);
        let ex = sx, ey = startY, ez = sz;
        for (let t = 0; t <= length; t++) {
          ex = sx + dirX * t;
          ez = sz + dirZ * t;
          ey = startY + t * 0.55;
          const bx = Math.round(ex);
          const by = Math.round(ey);
          const bz = Math.round(ez);
          put(bx, by, bz, 'trunk');
          if (t < length * 0.5) {
            put(bx + 1, by, bz, 'trunk');
            put(bx, by, bz + 1, 'trunk');
          }
          if (t === Math.floor(length * 0.55)) {
            blobs.push({ x: ex, y: ey + 1, z: ez, r: 3.6 + rnd() * 0.8 });
          }
        }
        blobs.push({ x: ex, y: ey + 1.5, z: ez, r: 4.6 + rnd() * 1.6 });
      }

      // Relleno de copas con borde irregular para que parezcan hojas, no esferas.
      blobs.forEach((b) => {
        const R = Math.ceil(b.r) + 1;
        for (let x = -R; x <= R; x++) {
          for (let y = -R; y <= R; y++) {
            for (let z = -R; z <= R; z++) {
              const wx = Math.round(b.x) + x;
              const wy = Math.round(b.y) + y;
              const wz = Math.round(b.z) + z;
              if (wy < 12) continue;
              const d = Math.sqrt(x * x + (y * 1.2) * (y * 1.2) + z * z) / b.r;
              if (d < 0.78 + rnd() * 0.32) put(wx, wy, wz, rnd() < 0.09 ? 'accent' : 'leaf');
            }
          }
        }
      });

      // Quitar voxels interiores (invisibles) para aligerar el render.
      const result = [];
      let maxY = 0;
      voxels.forEach((v) => {
        const hidden = voxels.has(key(v.x + 1, v.y, v.z)) && voxels.has(key(v.x - 1, v.y, v.z))
          && voxels.has(key(v.x, v.y + 1, v.z)) && voxels.has(key(v.x, v.y - 1, v.z))
          && voxels.has(key(v.x, v.y, v.z + 1)) && voxels.has(key(v.x, v.y, v.z - 1));
        if (hidden) return;
        v.j = rnd() - 0.5;
        maxY = Math.max(maxY, v.y);
        result.push(v);
      });
      result.forEach((v) => { v.h = v.y / maxY; });
      result.sort((a, b) => a.y - b.y);
      return result;
    }

    function buildTree(seed) {
      disposeMesh(treeMesh);
      treeVoxels = generateTree(seed);
      treeScale = Math.max(0.35, (qrWorldSize * 0.62) / 38);

      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
      treeMesh = new THREE.InstancedMesh(geo, mat, treeVoxels.length);
      treeMesh.castShadow = true;
      treeMesh.receiveShadow = true;
      treeMesh.frustumCulled = false;

      treeVoxels.forEach((v, i) => {
        dummy.position.set(v.x * treeScale, treeBaseY + (v.y + 0.5) * treeScale, v.z * treeScale);
        dummy.scale.setScalar(treeScale);
        dummy.updateMatrix();
        treeMesh.setMatrixAt(i, dummy.matrix);
      });
      treeMesh.instanceMatrix.needsUpdate = true;
      treeMesh.count = isDiorama ? treeVoxels.length : 0;
      treeAnim.n = isDiorama ? 1 : 0;
      treeMesh.visible = isDiorama;
      treeGroup.add(treeMesh);
      recolorTree();
    }

    function recolorTree() {
      if (!treeMesh) return;
      for (let i = 0; i < treeVoxels.length; i++) {
        const v = treeVoxels[i];
        if (v.kind === 'trunk') {
          tmpColor.copy(live.trunk).offsetHSL(0, 0, v.j * 0.08);
        } else if (v.kind === 'accent') {
          tmpColor.copy(live.accents).offsetHSL(0, 0, v.j * 0.08);
        } else {
          tmpColor.copy(live.leaves).offsetHSL(v.j * 0.02, 0, (v.h - 0.55) * 0.16 + v.j * 0.1);
        }
        treeMesh.setColorAt(i, tmpColor);
      }
      if (treeMesh.instanceColor) treeMesh.instanceColor.needsUpdate = true;
    }

    // ---------- QR / terreno ----------
    function buildQr(matrix) {
      disposeMesh(qrMesh);
      disposeMesh(plinth);
      disposeMesh(detailMesh);

      const moduleCount = matrix.length;
      const fullCount = moduleCount + quietZone * 2;
      qrWorldSize = fullCount * cellSize;
      viewSize = Math.max(22, qrWorldSize * 1.14);
      const centerOffset = (fullCount - 1) / 2;
      const treeClear = Math.max(2.4, qrWorldSize * 0.06);

      entries = [];
      for (let row = 0; row < fullCount; row++) {
        for (let col = 0; col < fullCount; col++) {
          const inQr = row >= quietZone && row < fullCount - quietZone && col >= quietZone && col < fullCount - quietZone;
          const dark = inQr ? matrix[row - quietZone][col - quietZone] : false;
          const x = (col - centerOffset) * cellSize;
          const z = (row - centerOffset) * cellSize;
          const rnd = cellHash(row, col);
          let dioH = dark ? 0.4 + rnd * 0.6 : 0.2 + rnd * 0.3;
          if (Math.hypot(x, z) <= treeClear) dioH = 0.3;
          entries.push({ x, z, dark, dioH, h: qrFlatHeight, from: qrFlatHeight, to: qrFlatHeight, tone: rnd - 0.5 });
        }
      }
      treeBaseY = 0.3;

      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
      qrMesh = new THREE.InstancedMesh(geo, mat, entries.length);
      qrMesh.castShadow = isDiorama;
      qrMesh.receiveShadow = true;
      qrMesh.frustumCulled = false;
      world.add(qrMesh);

      // Base de tierra del diorama (queda bajo el plano del QR, invisible en vista plana).
      plinth = new THREE.Mesh(
        new THREE.BoxGeometry(qrWorldSize, 3, qrWorldSize),
        new THREE.MeshLambertMaterial({ color: live.soil })
      );
      plinth.position.y = -1.5;
      plinth.receiveShadow = true;
      world.add(plinth);

      // Flores y piedritas sobre celdas claras, lejos del árbol.
      const rng = mulberry32(hashString(urlInput.value || 'x') ^ 0x9e3779b9);
      const candidates = entries.filter((e) => !e.dark && Math.hypot(e.x, e.z) > treeClear + 3);
      details = [];
      for (let i = 0; i < Math.min(40, candidates.length); i++) {
        const e = candidates.splice(Math.floor(rng() * candidates.length), 1)[0];
        details.push({ entry: e, kind: rng() < 0.7 ? 'flower' : 'rock', size: 0.26 + rng() * 0.16, j: rng() });
      }
      detailMesh = new THREE.InstancedMesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshLambertMaterial({ color: 0xffffff }),
        Math.max(1, details.length)
      );
      detailMesh.castShadow = true;
      detailMesh.frustumCulled = false;
      world.add(detailMesh);

      // Sol: sombras ajustadas al tamaño del QR.
      const s = qrWorldSize;
      sun.position.set(s * 0.55, s * 0.9, s * 0.4);
      sun.target.position.set(0, 0, 0);
      sun.shadow.camera.left = -s * 0.75;
      sun.shadow.camera.right = s * 0.75;
      sun.shadow.camera.top = s * 0.75;
      sun.shadow.camera.bottom = -s * 0.75;
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = s * 3;
      sun.shadow.camera.updateProjectionMatrix();

      blockAnim.p = isDiorama ? 1 : 0;
      entries.forEach((e) => { e.h = isDiorama ? e.dioH : qrFlatHeight; });

      updateCameraFrustum();
      buildTree(hashString(urlInput.value || 'seed'));
      buildParticles();
      qrDirty = true;
      colorsDirty = true;
    }

    function updateQr() {
      const rotate = blockAnim.p;
      for (let i = 0; i < entries.length; i++) {
        const e = entries[i];
        dummy.position.set(e.x, e.h / 2, e.z);
        dummy.scale.set(cellSize * 0.995, e.h, cellSize * 0.995);
        dummy.updateMatrix();
        qrMesh.setMatrixAt(i, dummy.matrix);
      }
      qrMesh.instanceMatrix.needsUpdate = true;

      details.forEach((d, i) => {
        const size = d.size * rotate;
        dummy.position.set(d.entry.x, d.entry.h + size / 2, d.entry.z);
        dummy.scale.set(size, d.kind === 'flower' ? size * 1.6 : size, size);
        dummy.updateMatrix();
        detailMesh.setMatrixAt(i, dummy.matrix);
      });
      if (details.length) detailMesh.instanceMatrix.needsUpdate = true;
    }

    function recolor() {
      const mix = blockAnim.p;
      for (let i = 0; i < entries.length; i++) {
        const e = entries[i];
        const flat = e.dark ? live.dark : live.light;
        const dio = e.dark ? tmpColor2.copy(live.dark).lerp(live.grass, 0.4) : live.grass;
        tmpColor.copy(flat).lerp(dio, mix);
        tmpColor.offsetHSL(0, 0, e.tone * 0.07 * mix);
        qrMesh.setColorAt(i, tmpColor);
      }
      if (qrMesh.instanceColor) qrMesh.instanceColor.needsUpdate = true;

      const flowerColors = [live.accents, new THREE.Color('#ffffff'), live.accents];
      details.forEach((d, i) => {
        if (d.kind === 'rock') tmpColor.set('#9a9588').offsetHSL(0, 0, d.j * 0.1);
        else tmpColor.copy(flowerColors[Math.floor(d.j * 3) % 3]);
        detailMesh.setColorAt(i, tmpColor);
      });
      if (detailMesh.instanceColor) detailMesh.instanceColor.needsUpdate = true;

      if (plinth) plinth.material.color.copy(live.soil);
      recolorTree();
    }

    function updateCameraFrustum() {
      const aspect = window.innerWidth / window.innerHeight;
      const halfH = viewSize / 2;
      const halfW = halfH * aspect;
      camera.left = -halfW;
      camera.right = halfW;
      camera.top = halfH;
      camera.bottom = -halfH;
      camera.updateProjectionMatrix();
    }

    // ---------- Partículas (pétalos en primavera, hojas en otoño) ----------
    function buildParticles() {
      if (particles) {
        particles.geometry.dispose();
        particles.material.dispose();
        world.remove(particles);
      }
      const count = 220;
      const pos = new Float32Array(count * 3);
      particleVelocities = new Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3] = (Math.random() - 0.5) * (qrWorldSize + 10);
        pos[i * 3 + 1] = 5 + Math.random() * 12;
        pos[i * 3 + 2] = (Math.random() - 0.5) * (qrWorldSize + 10);
        particleVelocities[i] = 0.012 + Math.random() * 0.035;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: live.particle, size: 0.2, transparent: true, opacity: 0.85 });
      particles = new THREE.Points(geo, mat);
      particles.visible = currentSeason !== 'summer' && isDiorama;
      world.add(particles);
    }

    // ---------- Animaciones ----------
    function animateBlocks(toDiorama) {
      entries.forEach((e) => {
        e.from = e.h;
        e.to = toDiorama ? e.dioH : qrFlatHeight;
      });
      const startP = blockAnim.p;
      gsap.killTweensOf(blockAnim);
      const proxy = { t: 0 };
      gsap.to(proxy, {
        t: 1,
        duration: toDiorama ? 0.9 : 0.65,
        ease: toDiorama ? 'power2.out' : 'power2.inOut',
        onUpdate: () => {
          entries.forEach((e) => { e.h = e.from + (e.to - e.from) * proxy.t; });
          blockAnim.p = startP + ((toDiorama ? 1 : 0) - startP) * proxy.t;
          qrDirty = true;
          colorsDirty = true;
        }
      });
    }

    function showTree() {
      if (!treeMesh) return;
      treeMesh.visible = true;
      gsap.killTweensOf(treeAnim);
      gsap.to(treeAnim, {
        n: 1,
        duration: 1.6,
        delay: 0.25,
        ease: 'power1.out',
        onUpdate: () => { treeMesh.count = Math.max(1, Math.floor(treeAnim.n * treeVoxels.length)); }
      });
    }

    function hideTree() {
      if (!treeMesh) return;
      gsap.killTweensOf(treeAnim);
      gsap.to(treeAnim, {
        n: 0,
        duration: 0.45,
        ease: 'power2.inOut',
        onUpdate: () => { treeMesh.count = Math.floor(treeAnim.n * treeVoxels.length); },
        onComplete: () => { treeMesh.visible = false; }
      });
    }

    function setSeasonButtonState(season) {
      seasonButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.season === season);
      });
    }

    function applySeason(season) {
      currentSeason = season;
      setSeasonButtonState(season);
      const palette = palettes[season];
      const proxy = { t: 0 };
      Object.keys(live).forEach((name) => {
        const target = new THREE.Color(palette[name]);
        gsap.to(live[name], { r: target.r, g: target.g, b: target.b, duration: 0.75, ease: 'power1.inOut' });
      });
      gsap.to(proxy, { t: 1, duration: 0.8, onUpdate: () => { colorsDirty = true; } });

      if (particles) {
        particles.material.color.copy(live.particle);
        particles.visible = season !== 'summer' && isDiorama;
      }
      document.documentElement.style.setProperty('--accent', palette.uiAccent);
    }

    function setView(diorama) {
      isDiorama = diorama;
      toggleViewBtn.textContent = diorama ? 'Tap to see QR code' : 'Tap to see the tree';
      gsap.fromTo(toggleViewBtn, { scale: 0.97 }, { scale: 1, duration: 0.32, ease: 'back.out(2.4)' });

      const distance = Math.max(30, qrWorldSize * 1.35);
      const targetPos = diorama ? { x: distance, y: distance, z: distance } : { x: 0, y: 80, z: 0 };
      const targetUp = diorama ? { x: 0, y: 1, z: 0 } : { x: 0, y: 0, z: -1 };

      gsap.to(camera.position, { ...targetPos, duration: 1, ease: 'power2.inOut', onUpdate: () => camera.lookAt(0, 0, 0) });
      gsap.to(camera.up, { ...targetUp, duration: 1, ease: 'power2.inOut', onUpdate: () => camera.lookAt(0, 0, 0) });
      gsap.to(camera, {
        zoom: diorama ? 0.86 : 1,
        duration: 1,
        ease: 'power2.inOut',
        onUpdate: () => camera.updateProjectionMatrix()
      });

      // Al volver al QR, el diorama regresa a su ángulo original (por el camino corto).
      const twoPi = Math.PI * 2;
      if (!diorama) {
        world.rotation.y = ((world.rotation.y % twoPi) + twoPi * 1.5) % twoPi - Math.PI;
        gsap.to(world.rotation, { y: 0, duration: 0.8, ease: 'power2.inOut' });
      }

      qrMesh.castShadow = diorama;
      animateBlocks(diorama);
      if (particles) particles.visible = diorama && currentSeason !== 'summer';
      if (diorama) showTree(); else hideTree();
    }

    function regenerateQrFromInput() {
      try {
        const normalized = normalizeUrl(urlInput.value);
        const matrix = makeQrMatrix(normalized);
        urlInput.value = normalized;
        buildQr(matrix);
        applySeason(currentSeason);
        setStatus('QR actualizado correctamente.');
      } catch (error) {
        setStatus(error.message || 'No se pudo generar el QR.', true);
      }
    }

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraFrustum();
    }

    // ---------- Giro del diorama con el puntero ----------
    function setupDrag() {
      const el = renderer.domElement;
      el.addEventListener('pointerdown', (e) => {
        if (!isDiorama) return;
        dragState.active = true;
        dragState.x = e.clientX;
        gsap.killTweensOf(world.rotation);
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', (e) => {
        if (!dragState.active) return;
        world.rotation.y += (e.clientX - dragState.x) * 0.008;
        dragState.x = e.clientX;
      });
      const stop = () => { dragState.active = false; };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    }

    function init() {
      urlInput.value = 'https://github.com/Diegood-02/Arbol_qr';
      statusEl.style.opacity = '0';
      regenerateQrFromInput();
      setView(false);

      generateBtn.addEventListener('click', regenerateQrFromInput);
      urlInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          regenerateQrFromInput();
        }
      });

      toggleViewBtn.addEventListener('click', () => setView(!isDiorama));

      seasonButtons.forEach((button) => {
        button.addEventListener('click', () => {
          gsap.fromTo(button, { y: 0 }, { y: -2, duration: 0.14, yoyo: true, repeat: 1, ease: 'power1.inOut' });
          applySeason(button.dataset.season);
        });
      });

      window.addEventListener('resize', onResize);
      setupDrag();

      // Atajos para capturas/pruebas: #tree abre el diorama, #autumn / #spring fijan la estación.
      const hash = location.hash.slice(1).split(',');
      if (hash.includes('autumn') || hash.includes('spring')) {
        const season = hash.includes('autumn') ? 'autumn' : 'spring';
        Object.keys(live).forEach((name) => live[name].set(palettes[season][name]));
        applySeason(season);
      }
      if (hash.includes('tree')) {
        setView(true);
        gsap.globalTimeline.totalProgress(1);
      }
    }

    function tick() {
      requestAnimationFrame(tick);

      if (qrDirty) { updateQr(); qrDirty = false; }
      if (colorsDirty) { recolor(); colorsDirty = false; }

      if (particles && particles.visible) {
        const attr = particles.geometry.getAttribute('position');
        const t = performance.now() * 0.001;
        for (let i = 0; i < attr.count; i++) {
          let y = attr.array[i * 3 + 1];
          y -= particleVelocities[i];
          attr.array[i * 3] += Math.sin(t + i) * 0.006;
          if (y < 0.3) {
            y = 8 + Math.random() * 12;
            attr.array[i * 3] = (Math.random() - 0.5) * (qrWorldSize + 10);
            attr.array[i * 3 + 2] = (Math.random() - 0.5) * (qrWorldSize + 10);
          }
          attr.array[i * 3 + 1] = y;
        }
        attr.needsUpdate = true;
      }

      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }

    init();
    tick();
  </script>
</body>
</html>
